<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>JustB · Magazine Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1b1b1b; font-family: Geist, ui-sans-serif, system-ui; }
  body { overflow: hidden; }
  @keyframes caret { 0%, 50% { opacity: 1 } 50.1%, 100% { opacity: 0 } }
  /* hide design canvas hint clutter if any */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentDay": "#b56a3a",
  "accentNight": "#d7a85f",
  "showNight": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const dayFrame = (Screen, label) => (
    <DCArtboard id={`day-${label}`} label={label} width={402} height={874}>
      <IOSFrame dark={false}>
        <Screen dark={false} accent={t.accentDay} />
      </IOSFrame>
    </DCArtboard>
  );
  const nightFrame = (Screen, label) => (
    <DCArtboard id={`night-${label}`} label={label} width={402} height={874}>
      <IOSFrame dark={true}>
        <Screen dark={true} accent={t.accentNight} />
      </IOSFrame>
    </DCArtboard>
  );

  return (
    <>
      <DesignCanvas title="JustB · refresh">
        <DCSection id="day" title="Day mode">
          {dayFrame(ScreenLocation, '01 Locate')}
          {dayFrame(ScreenReady, '02 Arrive')}
          {dayFrame(ScreenBreathing, '03 Breathe')}
          {dayFrame(ScreenFeed, '04 Today')}
        </DCSection>
        {t.showNight && (
          <DCSection id="night" title="Night mode">
            {nightFrame(ScreenLocation, '01 Locate · night')}
            {nightFrame(ScreenReady, '02 Arrive · night')}
            {nightFrame(ScreenBreathing, '03 Breathe · night')}
            {nightFrame(ScreenFeed, '04 Today · night')}
          </DCSection>
        )}
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Color">
          <TweakColor
            label="Day accent"
            value={t.accentDay}
            onChange={(v) => setTweak('accentDay', v)}
            options={['#b56a3a', '#8b6914', '#3f5b4a', '#3a557a', '#5a3a4a']}
          />
          <TweakColor
            label="Night accent"
            value={t.accentNight}
            onChange={(v) => setTweak('accentNight', v)}
            options={['#d7a85f', '#c89a5e', '#8aa9b8', '#b89890', '#9a8db8']}
          />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakToggle
            label="Show night mode"
            value={t.showNight}
            onChange={(v) => setTweak('showNight', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// IOSFrame wrapper around an IPhone bezel — using a simple shell here (no status bar nav for full-bleed screens)
function IOSFrame({ children, dark }) {
  return (
    <div style={{
      width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#0f111a' : '#f5efe4',
      boxShadow: '0 40px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.12)',
    }}>
      {/* outer bezel ring */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 48,
        boxShadow: 'inset 0 0 0 8px ' + (dark ? '#1c1c1c' : '#1c1c1c'),
        pointerEvents: 'none', zIndex: 100,
      }} />
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar text */}
      <div style={{
        position: 'absolute', top: 18, left: 0, right: 0, zIndex: 60,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '0 32px', pointerEvents: 'none',
        fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590, fontSize: 16,
        color: dark ? '#e8e2d3' : '#1c1a16',
      }}>
        <span>9:41</span>
        <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="6.5" width="3" height="4.5" rx="0.7" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.7" fill="currentColor"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.7" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.7" fill="currentColor"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.2" stroke="currentColor" strokeOpacity="0.4" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/><path d="M23.5 4v4c.8-.3 1.3-1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>
      {/* content (scrollable) */}
      <div style={{
        position: 'absolute', inset: 0, overflow: 'auto', borderRadius: 48,
        background: dark ? '#0f111a' : '#f5efe4',
      }}>
        {children}
      </div>
      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 139, height: 5, borderRadius: 100,
        background: dark ? 'rgba(232,226,211,0.7)' : 'rgba(28,26,22,0.35)',
        zIndex: 100, pointerEvents: 'none',
      }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
